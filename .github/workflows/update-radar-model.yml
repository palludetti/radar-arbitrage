name: Update Radar AI model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-radar-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update default model
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'app/api/analyze/route.ts';
          let s = fs.readFileSync(p, 'utf8');
          const from = 'process.env.RADAR_AI_MODEL || "openai/gpt-5.4"';
          const to = 'process.env.RADAR_AI_MODEL || "openai/gpt-5.6-sol"';
          if (!s.includes(from)) throw new Error('Old model string not found');
          s = s.replace(from, to);
          fs.writeFileSync(p, s);
          NODE
      - name: Remove one-off workflow
        run: rm .github/workflows/update-radar-model.yml
      - name: Commit model update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/analyze/route.ts .github/workflows/update-radar-model.yml
          git commit -m "Use GPT-5.6 Sol for Radar image extraction"
          git push
