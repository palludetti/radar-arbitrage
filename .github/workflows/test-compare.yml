name: Smoke test compare API

on:
  push:
    paths:
      - '.github/workflows/test-compare.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call production compare API
        run: |
          sleep 5
          curl -sS --fail-with-body -X POST 'https://radar-arbitrage.vercel.app/api/compare' \
            -H 'content-type: application/json' \
            --data '{"category":"Cartas / Pokémon","brand":"Pokémon","model":"Charizard TG03/TG30 Lost Origin PSA 9","askingPrice":700,"fees":0,"sourcePlatform":"Enjoei","seller":"fabio","notes":"Anúncio alega PSA 9; validar certificado.","extractionConfidence":{"brand":100,"model":90,"askingPrice":100}}' \
            -o /tmp/compare.json
          cat /tmp/compare.json
          node -e "const x=require('/tmp/compare.json'); if(!x.verdict||!Array.isArray(x.comparables)) process.exit(1); console.log('VERDICT',x.verdict,'COMPS',x.comparables.length,'CONF',x.marketConfidence)"
