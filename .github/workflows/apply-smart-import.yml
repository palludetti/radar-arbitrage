name: Apply Smart Import

on:
  push:
    branches: [feature/smart-import]
    paths:
      - '.github/workflows/apply-smart-import.yml'
      - '.github/scripts/apply-smart-import.mjs'
      - 'app/SmartImport.tsx'
      - 'app/api/analyze/route.ts'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-import
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/apply-smart-import.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Integrate smart listing capture"
          git push origin HEAD:feature/smart-import
