name: Smoke test compare API

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview base URL
        required: true
        default: https://radar-arbitrage.vercel.app
      repetitions:
        description: Number of sequential checks (1-3)
        required: true
        default: "3"

concurrency:
  group: radar-compare-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run semantic production checks
        env:
          RADAR_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RADAR_SMOKE_REPETITIONS: ${{ inputs.repetitions }}
          RADAR_API_ACCESS_TOKEN: ${{ secrets.RADAR_API_ACCESS_TOKEN }}
        run: node scripts/smoke-compare.mjs
